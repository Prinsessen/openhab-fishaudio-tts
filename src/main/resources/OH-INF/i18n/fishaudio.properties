# add-on

addon.fishaudio.name = fish.audio Text-to-Speech
addon.fishaudio.description = Text-to-speech with fish.audio voice models (e.g. a HAL 9000 voice), with a Google Translate fallback.

# add-on config

voice.config.fishaudio.group.authentication.label = Authentication and voices
voice.config.fishaudio.group.authentication.description = The API key and the voice models come from the secrets file, never from this page.
voice.config.fishaudio.group.tts.label = Synthesis
voice.config.fishaudio.group.tts.description = How fish.audio is asked.
voice.config.fishaudio.group.fallback.label = Fallback and errors
voice.config.fishaudio.group.fallback.description = What happens when fish.audio does not answer.
voice.config.fishaudio.secretsFile.label = Secrets file
voice.config.fishaudio.secretsFile.description = JSON with api_key, reference_id (or a voices list), model, language, speed. Re-read when the file changes.
voice.config.fishaudio.apiKey.label = API key (override)
voice.config.fishaudio.apiKey.description = Only if the key should not come from the secrets file.
voice.config.fishaudio.apiUrl.label = API URL
voice.config.fishaudio.model.label = Model
voice.config.fishaudio.model.description = Sent as the model header. The secrets file's model wins when present.
voice.config.fishaudio.speed.label = Speed
voice.config.fishaudio.speed.description = Prosody speed. 0.9 is HAL's unhurried delivery. The secrets file's speed wins when present.
voice.config.fishaudio.mp3Bitrate.label = MP3 bitrate (kbit/s)
voice.config.fishaudio.timeoutSeconds.label = Timeout (s)
voice.config.fishaudio.fallbackGoogle.label = Fall back to Google Translate
voice.config.fishaudio.fallbackGoogle.description = When fish.audio fails, speak through Google Translate's voice instead, so no message is lost.
voice.config.fishaudio.fallbackLanguage.label = Fallback language
voice.config.fishaudio.fallbackLanguage.description = Language code of the Google voice used as fallback (da = Danish, as the old script did).
voice.config.fishaudio.googleUrl.label = Google Translate URL
voice.config.fishaudio.sayItem.label = Say item
voice.config.fishaudio.sayItem.description = Item whose commands are spoken on the add-on's own thread, so a rule is free at once: a JSON {"text", "voice", "sink", "volume"} or a plain text. Empty = off.
voice.config.fishaudio.sinkGuard.label = Sink guard
voice.config.fishaudio.sinkGuard.description = After the clip: put the player's volume back and resume what played before, through the items linked to the sink thing's state/volume/control channels, if the binding did not (Sonos with a music-service queue).
voice.config.fishaudio.sinkGuardSettleSeconds.label = Sink guard settle (s)
voice.config.fishaudio.sinkGuardSettleSeconds.description = Seconds to wait after the clip before the guard looks, so the binding's own restore has had its chance.
voice.config.fishaudio.errorItem.label = Error item
voice.config.fishaudio.errorItem.description = String item that receives "HTTP <code> at <time>" when a fish.audio call fails (a rule mails on it). Empty = off.

# voices

voice.fishaudio.label = fish.audio Text-to-Speech
